<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Web Game</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .hero h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 1rem;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      display: block;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, background 0.2s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.14);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .card p {
      margin: 0;
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="hero">
      <h1>Random Web Game</h1>
      <p>Menu yang dibuat dengan sangat niat, indeed.</p>
    </header>

    <main class="grid">
      <a class="card" href="3dRotatingCube/index.html">
        <h2>3D Rotating Cube</h2>
      </a>

      <a class="card" href="AimTraining/index.html">
        <h2>Aim Training</h2>
      </a>

      <a class="card" href="AvoidTheObstacle/index.html">
        <h2>Avoid The Obstacle</h2>
      </a>

      <a class="card" href="BouncyBalls/index.html">
        <h2>Bouncy Balls</h2>
      </a>

      <a class="card" href="CatchTheObject/index.html">
        <h2>Catch The Object</h2>
      </a>

      <a class="card" href="MatchingColor/index.html">
        <h2>Matching Color</h2>
      </a>

      <a class="card" href="PaddleBall/index.html">
        <h2>Paddle Ball</h2>
      </a>

      <a class="card" href="SolidSnake/index.html">
        <h2>Solid Snake</h2>
      </a>

      <a class="card" href="SpaceSimulation/index.html">
        <h2>Space Simulation</h2>
      </a>

      <a class="card" href="SimplePlatformer/index.html">
        <h2>Simple Platformer</h2>
      </a>
    </main>
  </div>
</body>

</html>
